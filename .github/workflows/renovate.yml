name: Renovate

on:
  push:
    branches:
      - "main"
    paths:
      # Configuration: re-run so config changes take effect immediately.
      # `renovate.json` holds the package rules; `renovate-config.json` is the
      # self-hosted runner config passed via `configurationFile:`. Watch both —
      # watching only the runner config means package-rule edits never trigger.
      - "renovate.json"
      - "renovate-config.json"
      - ".github/workflows/renovate.yml"
      # Shared dependency manifests: a merge here puts every other open
      # dependency PR one commit behind the default branch. Re-running lets
      # Renovate rebase them right away instead of leaving them conflicted
      # until the next cron.
      - "Directory.Packages.props"
      - "**/dotnet-tools.json"
      - "src/anvilboard-web/package.json"
      - "src/anvilboard-web/pnpm-lock.yaml"
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  schedule:
    - cron: "0 8 * * *"

# Renovate mutates branches, so overlapping runs can race. Queue a follow-up run
# instead of cancelling: the in-progress run may predate the merge that
# triggered this one, so cancelling it could drop the rebase we want.
concurrency:
  group: renovate
  cancel-in-progress: false

# The RENOVATE_TOKEN PAT does the pushing, so `GITHUB_TOKEN` only checks out the
# repo. Keep `packages: read` so the repo is ready for a private feed.
permissions:
  contents: read
  packages: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v48.0.0
        with:
          configurationFile: renovate-config.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        # env:
        #   LOG_LEVEL: "debug"
