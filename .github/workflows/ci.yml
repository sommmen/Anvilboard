# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

jobs:
  build-and-test-dotnet:
    name: Build and Test (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Anvilboard
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Anvilboard.slnx

      - name: Build
        run: dotnet build Anvilboard.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Anvilboard.slnx --no-build --no-restore --configuration Release --verbosity normal --report-gh

  build-and-test-web:
    name: Build and Test (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/anvilboard-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          working-directory: src/anvilboard-web
          require-lockfile: true
          cache: true

      - name: Lint (format check)
        run: pnpm exec prettier --check "src/**/*.{ts,html,scss}"

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test --watch=false

  ci:
    name: ci
    needs: [build-and-test-dotnet, build-and-test-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report CI result
        run: |
          if [[ "${{ needs.build-and-test-dotnet.result }}" != "success" ]] || \
             [[ "${{ needs.build-and-test-web.result }}" != "success" ]]; then
            echo "CI checks failed"
            exit 1
          fi
          echo "All CI checks passed."
